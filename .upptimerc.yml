# KIVO's status page: https://onekivo.github.io/status/
# Configuration reference: https://upptime.js.org/docs/configuration
#
# Runs on GitHub, never on our own hosts, so it still reports when they are
# down. Every check goes through the same public names customers use (Bunny's
# edge included), from GitHub-hosted runners.
owner: onekivo
repo: status
user-agent: onekivo

# No check needs a secret; an empty list keeps every repository secret out of
# the checks.
secrets: []

sites:
  # 503 when the database or the queue schema fails; 200 "degraded" when
  # storage, KMS or mail fails (src/pages/api/health.ts in onekivo/Kivo).
  - name: App
    slug: app
    url: https://app.onekivo.com/api/health
    icon: https://onekivo.github.io/status/kivo-192.png
    maxResponseTime: 5000
    __dangerous__body_degraded: '"status":"degraded"'
    __dangerous__body_down_if_regex_missing: '"status":"(healthy|degraded)"'
  # 503 when the queue consumers failed to register; 200 "degraded" when the
  # database, the cron schedules or the crypto self-check failed
  # (worker/src/index.ts in onekivo/Kivo).
  - name: Background jobs
    slug: worker
    url: https://worker.onekivo.com/health
    icon: https://onekivo.github.io/status/kivo-192.png
    maxResponseTime: 5000
    __dangerous__body_degraded: '"status":"degraded"'
    __dangerous__body_down_if_regex_missing: '"status":"(ok|degraded)"'
  - name: Website
    slug: website
    url: https://onekivo.com/
    icon: https://onekivo.github.io/status/kivo-192.png
    maxResponseTime: 5000
  - name: Short links and QR codes
    slug: qr
    url: https://qr.onekivo.com/healthz
    icon: https://onekivo.github.io/status/kivo-192.png
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"ok":true'

# Keep every incident in the history, even one shorter than 15 minutes.
skipDeleteIssues: true
skipPoweredByReadme: true
# Description, topics and homepage are set by hand; the App has no
# administration permission to rewrite them.
skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

status-website:
  baseUrl: /status
  name: KIVO Status
  logoUrl: https://onekivo.github.io/status/kivo.svg
  logoHref: https://onekivo.github.io/status/
  favicon: https://onekivo.github.io/status/kivo-192.png
  faviconSvg: https://onekivo.github.io/status/kivo.svg
  introTitle: "Availability of **KIVO**"
  introMessage: Checked every five minutes from outside our own infrastructure. Questions about an incident? Write to [hello@onekivo.com](mailto:hello@onekivo.com).
  navbar:
    - title: Status
      href: /
    - title: KIVO
      href: https://app.onekivo.com
  robotsText: "User-agent: *\nAllow: /"
